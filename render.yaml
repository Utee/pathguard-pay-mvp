# Applying this Blueprint provisions paid resources. Review the cost first.
previews:
  generation: "off"

services:
  - type: web
    name: pathguard-pay-api
    runtime: python
    rootDir: backend
    region: oregon
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: pathguard-pay-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PUBLIC_API_URL
        fromService:
          type: web
          name: pathguard-pay-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: pathguard-pay
          envVarKey: RENDER_EXTERNAL_URL
      - key: PAYPAL_FRONTEND_URL
        fromService:
          type: web
          name: pathguard-pay
          envVarKey: RENDER_EXTERNAL_URL
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_VAULT_ENCRYPTION_KEY
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-super-120b-a12b:free

  - type: web
    name: pathguard-pay
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: pathguard-pay-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: pathguard-pay-db
    databaseName: pathguard_pay
    user: pathguard_pay
    region: oregon
    plan: 0.1c-256mb
    diskSizeGB: 1
    ipAllowList: []
